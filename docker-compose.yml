services:
  mysql:
    image: mysql:8.0
    container_name: java_lab_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: asset_hub_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - lab-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: java_lab_keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import
    ports:
      - "8081:8080"
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge